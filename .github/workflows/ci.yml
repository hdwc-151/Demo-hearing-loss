name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: pytest (API, DSP, GraphRAG, fixture còn tươi)
        run: python -m pytest tests -q
      - name: Đo GraphRAG (dev + holdout)
        run: python tests/eval_retrieval.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Parity JS-Python + test logic
        run: npm test
      - run: npm run build
      - name: Lỗ hổng dependency chạy thật (react, zustand, capacitor)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt playwright pillow && playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - name: Chạy backend + frontend dev rồi các bộ e2e
        run: |
          (cd backend && python -m uvicorn main:app --port 8000 &)
          (cd frontend && npx vite --port 5173 --strictPort &)
          for i in $(seq 1 60); do curl -sf localhost:5173/api/health && break; sleep 1; done
          cd tests && python e2e_browser.py && python e2e_review.py && python e2e_mobile.py && python e2e_audio_lab.py
      - name: Bản demo một file (file://, không mạng)
        run: |
          (cd frontend && npm run build:demo)
          python tests/e2e_demo.py
      - name: PWA mở được khi mất mạng
        run: |
          (cd frontend && npm run build && npx vite preview --port 4173 --strictPort &)
          for i in $(seq 1 30); do curl -sf localhost:4173 >/dev/null && break; sleep 1; done
          python tests/e2e_pwa.py
