name: Mobile builds (Android / iOS)
# PR, main, chạy tay và tag v*: Android debug (test key), iOS Simulator không ký.
# Phát hành lên Google Play / App Store cần khoá ký: xem mobile/README.md (mục "Phát hành").
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ['frontend/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:debug
      - name: Android unit tests and lint
        run: bash ./gradlew testDebugUnitTest lintDebug
        working-directory: frontend/android
      - uses: actions/upload-artifact@v7
        with: { name: hearatlas-android-debug, path: frontend/android/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hearatlas-android-reports
          path: frontend/android/app/build/reports/
          if-no-files-found: warn

  ios:
    timeout-minutes: 30
    runs-on: macos-15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Toolchain versions
        run: xcodebuild -version && swift --version
      - name: Build cho iOS Simulator (không ký)
        run: npm run ios:debug
      - name: Check bundled privacy manifest and package Simulator app
        run: |
          plutil -lint ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
          ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ios/hearatlas-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: hearatlas-ios-simulator
          path: frontend/ios/hearatlas-simulator.zip
          if-no-files-found: error
