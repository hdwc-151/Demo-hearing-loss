name: Mobile builds (Android / iOS)
# Chạy tay (Actions -> Run workflow) hoặc khi gắn tag v*. Bản debug không ký, dùng để kiểm tra biên dịch.
# Phát hành lên Google Play / App Store cần khoá ký: xem mobile/README.md (mục "Phát hành").
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ['frontend/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: bash ./gradlew assembleDebug
        working-directory: frontend/android
      - uses: actions/upload-artifact@v4
        with: { name: hearatlas-android-debug, path: frontend/android/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error }

  ios:
    timeout-minutes: 30
    runs-on: macos-15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build cho iOS Simulator (không ký)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
