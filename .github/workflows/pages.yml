name: Deploy web (GitHub Pages)
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Pages không có backend: dựng bản PWA chạy hoàn toàn trong máy (VITE_API_BASE=offline), base theo tên repo
      - name: Build PWA (offline-first) + bản demo một file
        working-directory: frontend
        env: { VITE_BASE: "/${{ github.event.repository.name }}/", VITE_API_BASE: offline }
        run: |
          npm run build
          npm run build:demo -- dist/demo.html
      # Tự bật Pages khi repo chưa có site. Nếu token không có quyền admin,
      # cần bật Settings → Pages → Source: GitHub Actions một lần.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
