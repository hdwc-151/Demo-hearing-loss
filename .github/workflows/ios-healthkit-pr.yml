name: iOS HealthKit native compile (PR)
on:
  pull_request:
    paths:
      - 'frontend/ios/**'
      - 'frontend/src/util/healthkitAudiogram.js'
      - 'frontend/src/components/HealthImport.jsx'
      - '.github/workflows/ios-healthkit-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-compile:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Sync Capacitor native project
        run: npm run build && npx cap sync ios
      - name: Compile iOS Simulator (without signing or HealthKit permissions)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
